# En cada push: corre los tests en el PC y compila el plugin.
# Si un test falla, el commit queda marcado en rojo en GitHub.
name: Tests y compilacion
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-multilib
      - run: make -C tests

  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SDK de PSP
        run: |
          curl -sSL https://github.com/pspdev/pspdev/releases/latest/download/pspdev-ubuntu-latest-x86_64.tar.gz | tar xz -C $HOME
          echo "PSPDEV=$HOME/pspdev" >> $GITHUB_ENV
          echo "$HOME/pspdev/bin" >> $GITHUB_PATH
      - run: git clone --depth 1 https://github.com/TheOfficialFloW/Adrenaline ../Adrenaline
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: ge_patch
          path: ge_patch.prx
