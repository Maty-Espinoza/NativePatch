# On each push: builds NativeLink, NativeDraw and the installer with the same scripts used by hand.
# If it does not build, the commit shows red on GitHub. The binaries stay as the run's "artifact".
name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilers (pspdev and vitasdk)
        run: sh tools/setup.sh
      - name: Build
        run: sh tools/build.sh
      - name: Tests (capturer under qemu, logs, production build)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-arm-linux-gnueabihf
          sh tools/test_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nativepatch
          path: |
            build/nativelink.prx
            build/nativedraw.suprx
            build/NativePatch.vpk
