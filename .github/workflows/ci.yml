# En cada push: compila NativeLink, NativeDraw y el instalador con los mismos scripts que se usan a mano.
# Si no compila, el commit queda marcado en rojo en GitHub. Los binarios quedan como "artifact" de la corrida.
name: Compilacion
on: [push, pull_request]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiladores (pspdev y vitasdk)
        run: sh tools/setup.sh
      - name: Compilar
        run: sh tools/build.sh
      - name: Pruebas (capturador en qemu, logs, compilacion de produccion)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-arm-linux-gnueabihf
          sh tools/test_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nativepatch
          path: |
            build/nativelink.prx
            build/nativedraw.suprx
            build/NativePatch.vpk
