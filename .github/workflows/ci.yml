# En cada push: compila NativeLink, NativeDraw y el instalador con los mismos scripts que se usan a mano.
# Si no compila, el commit queda marcado en rojo en GitHub. Los binarios quedan como "artifact" de la corrida.
# TODO:
# - Si falla por las descargas de vitasdk (siempre la ultima instantanea), fijar la version en tools/preparar.sh.
name: Compilacion
on: [push, pull_request]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiladores (pspdev y vitasdk)
        run: sh tools/preparar.sh
      - name: Compilar
        run: sh tools/compilar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nativepatch
          path: |
            build/nativelink.prx
            build/nativedraw.suprx
            build/NativePatch.vpk
